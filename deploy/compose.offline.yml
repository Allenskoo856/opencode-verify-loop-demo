services:
  postgres:
    image: opencode-verify-postgres:14
    environment: { POSTGRES_DB: orders, POSTGRES_USER: orders, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set password} }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U orders -d orders"], interval: 5s, timeout: 3s, retries: 20 }
    volumes: [orders-data:/var/lib/postgresql/data]
  backend:
    image: opencode-verify-backend:${RELEASE_TAG:-offline}
    environment: { SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders, SPRING_DATASOURCE_USERNAME: orders, SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set password}, JWT_SECRET: ${JWT_SECRET:?set secret}, DEMO_USER: ${DEMO_USER:?set demo user}, DEMO_PASSWORD: ${DEMO_PASSWORD:?set demo password} }
    depends_on: { postgres: { condition: service_healthy } }
  frontend:
    image: opencode-verify-frontend:${RELEASE_TAG:-offline}
    depends_on: [backend]
    ports: ["4173:80"]
volumes: { orders-data: {} }
