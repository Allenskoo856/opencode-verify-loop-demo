name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
  backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8', cache: maven }
      - run: mvn -B -ntp test
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: docker compose -f deploy/compose.dev.yml up --build -d
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_SECRET: ci-jwt-secret-that-is-long-enough-for-tests
          DEMO_USER: demo@example.com
          DEMO_PASSWORD: demo-password-only-for-local
      # Java may still be starting after Compose has started the container. Retry
      # transient connection resets as well as connection refusals.
      - run: |
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 \
            http://localhost:8080/actuator/health
      - run: npm --prefix frontend run test:e2e
        env:
          E2E_BASE_URL: http://localhost:4173
          E2E_USER: demo@example.com
          E2E_PASSWORD: demo-password-only-for-local
      - if: always()
        run: |
          mkdir -p artifacts-compose
          docker compose -f deploy/compose.dev.yml ps -a > artifacts-compose/compose-ps.txt || true
          docker compose -f deploy/compose.dev.yml logs --no-color > artifacts-compose/compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/test-results
            artifacts-compose
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f deploy/compose.dev.yml down -v
  controller:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: false }
      - run: gofmt -w verify-controller/cmd/verify-loop/main.go verify-controller/internal/redact_test.go
      - run: git diff --exit-code
      - run: cd verify-controller && go test ./...
      - run: cd verify-controller && go build -trimpath -ldflags='-s -w' -o bin/verify-loop ./cmd/verify-loop
      - run: ./verify-controller/bin/verify-loop verify --profile auto
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: verify-controller-evidence, path: artifacts/verify, if-no-files-found: ignore }
  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-config.sh
