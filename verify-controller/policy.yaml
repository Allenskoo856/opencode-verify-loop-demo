version: 1
# Legacy static-Go fallback only. The canonical, extensible policy is
# verify/policy.json and is interpreted by verify-controller-ts.
protected:
  - .opencode/**
  - e2e/specs/**
  - verify/policy.json
  - verify/gates/**
  - offline/SHA256SUMS
completion:
  required_profiles: [auto, backend, frontend, full, staging]
  max_iterations: 5
  require_fresh_evidence: true
